[project]
name = "nasa-analog-asi"
version = "0.2.0"
description = "Transparent, exploratory Earth/Moon/Mars analog similarity scoring"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
